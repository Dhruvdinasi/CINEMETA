version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/cinemeta
      - JWT_SECRET=cinemeta_super_secret_jwt_key_2026
      - TMDB_API_KEY=${TMDB_API_KEY}
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:latest
    container_name: cinemeta_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
